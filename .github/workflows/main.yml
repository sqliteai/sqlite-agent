#
#  main.yml
#  sqlite-agent
#
#  Created by Gioele Cantoni on 05/11/25.
#

name: Build, Test and Release
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

# Least privilege by default; the release job widens it for itself. Previously
# `contents: write` applied to all 16 build jobs, which run third-party actions.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    if: ${{ !contains(github.event.head_commit.message, '[auto-update]') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container && matrix.container || '' }}
    name: ${{ matrix.name }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }} build${{ matrix.arch != 'arm64-v8a' && matrix.arch != 'armeabi-v7a' && matrix.name != 'ios-sim' && matrix.name != 'ios' && matrix.name != 'apple-xcframework' && matrix.name != 'android-aar' && ( matrix.name != 'macos' || matrix.arch != 'x86_64' ) && ' + test' || ''}}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-22.04
            arch: x86_64
            name: linux

          # Linux ARM64
          - os: ubuntu-22.04-arm
            arch: arm64
            name: linux

          # Linux musl x86_64
          - os: ubuntu-22.04
            arch: x86_64
            name: linux-musl
            container: alpine:latest

          # Linux musl ARM64
          - os: ubuntu-22.04-arm
            arch: arm64
            name: linux-musl

          # macOS universal binary (x86_64 + arm64)
          - os: macos-15
            name: macos

          # macOS x86_64 only
          - os: macos-15
            arch: x86_64
            name: macos
            make: ARCH=x86_64

          # macOS ARM64 only
          - os: macos-15
            arch: arm64
            name: macos
            make: ARCH=arm64

          # Windows x86_64
          - os: windows-2022
            arch: x86_64
            name: windows

          # Android ARM64-v8a
          - os: ubuntu-22.04
            arch: arm64-v8a
            name: android
            make: PLATFORM=android ARCH=arm64-v8a

          # Android ARMv7
          - os: ubuntu-22.04
            arch: armeabi-v7a
            name: android
            make: PLATFORM=android ARCH=armeabi-v7a

          # Android x86_64
          - os: ubuntu-22.04
            arch: x86_64
            name: android
            make: PLATFORM=android ARCH=x86_64
            sqlite-amalgamation-zip: https://sqlite.org/2025/sqlite-amalgamation-3490100.zip
            sqlite-amalgamation-sha256: 6cebd1d8403fc58c30e93939b246f3e6e58d0765a5cd50546f16c00fd805d2c3

          # iOS device
          - os: macos-15
            name: ios
            make: PLATFORM=ios

          # iOS simulator
          - os: macos-15
            name: ios-sim
            make: PLATFORM=ios-sim

          # Apple XCFramework
          - os: macos-15
            name: apple-xcframework
            make: xcframework

          # Android AAR
          - os: ubuntu-22.04
            name: android-aar
            make: aar

    defaults:
      run:
        shell: ${{ matrix.container && 'sh' || 'bash' }}

    steps:

      - name: linux-musl x86_64 install dependencies
        if: contains(matrix.name, 'linux-musl') && matrix.arch == 'x86_64'
        run: apk update && apk add --no-cache git gcc make sqlite musl-dev linux-headers bash

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: android setup java
        if: matrix.name == 'android-aar'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: linux-musl arm64 setup container
        if: matrix.name == 'linux-musl' && matrix.arch == 'arm64'
        run: |
          docker run -d --name alpine \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            alpine:latest \
            tail -f /dev/null
          docker exec alpine sh -c "apk update && apk add --no-cache git gcc make sqlite musl-dev linux-headers bash"

      - name: windows install dependencies
        if: matrix.name == 'windows'
        run: choco install sqlite -y

      - name: macos install dependencies
        if: matrix.name == 'macos'
        run: brew link sqlite --force

      - name: build sqlite-agent
        run: ${{ matrix.name == 'linux-musl' && matrix.arch == 'arm64' && 'docker exec alpine' || '' }} make extension ${{ matrix.make && matrix.make || ''}}

      # Signing runs only on main, which is the only ref that can release
      # (see the `release` job). Without the ref check these steps ran on every
      # branch push, so anyone able to push a branch could edit this workflow
      # and read the Apple signing secrets.
      # Secrets go through `env` rather than being interpolated into the script
      # body: an inline secrets expression is expanded into the shell text,
      # where a value containing a command substitution or a backtick would be
      # executed, and passing passwords as argv makes them visible to other
      # processes on the runner.
      - name: create keychain for codesign
        if: matrix.os == 'macos-15' && github.ref == 'refs/heads/main'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: codesign and notarize dylib
        if: matrix.os == 'macos-15' && matrix.name != 'apple-xcframework' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          codesign --sign "$APPLE_TEAM_ID" --timestamp --options runtime dist/agent.dylib
          ditto -c -k dist/agent.dylib dist/agent.zip
          xcrun notarytool submit dist/agent.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm dist/agent.zip

      - name: codesign and notarize xcframework
        if: matrix.name == 'apple-xcframework' && github.ref == 'refs/heads/main'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          find dist/agent.xcframework -name "*.framework" -exec echo "Signing: {}" \; -exec codesign --sign "$APPLE_TEAM_ID" --timestamp --options runtime {} \;
          codesign --sign "$APPLE_TEAM_ID" --timestamp --options runtime dist/agent.xcframework
          ditto -c -k --keepParent dist/agent.xcframework dist/agent.xcframework.zip
          xcrun notarytool submit dist/agent.xcframework.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm -rf dist/agent.xcframework

      # always(), so a failure in the steps above cannot leave the decoded
      # certificate on disk or the keychain unlocked.
      - name: cleanup keychain for codesign
        if: always() && matrix.os == 'macos-15' && github.ref == 'refs/heads/main'
        run: |
          rm -f certificate.p12
          security delete-keychain build.keychain || true

      - name: android setup test environment
        if: matrix.name == 'android' && matrix.arch != 'arm64-v8a' && matrix.arch != 'armeabi-v7a'
        run: |

          echo "::group::enable kvm group perms"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "::endgroup::"

          echo "::group::download and build sqlite3 without SQLITE_OMIT_LOAD_EXTENSION"
          # The archive is compiled and then executed, so its integrity is
          # pinned rather than trusted to the transport alone. Update both the
          # URL and this hash together when moving to a new amalgamation.
          curl --fail --location --show-error --silent -O ${{ matrix.sqlite-amalgamation-zip }}
          echo "${{ matrix.sqlite-amalgamation-sha256 }}  $(basename ${{ matrix.sqlite-amalgamation-zip }})" | sha256sum -c -
          unzip sqlite-amalgamation-*.zip
          export ${{ matrix.make }}
          $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.arch }}-linux-android26-clang sqlite-amalgamation-*/shell.c sqlite-amalgamation-*/sqlite3.c -o sqlite3 -ldl
          # remove unused folders to save up space
          rm -rf sqlite-amalgamation-*.zip sqlite-amalgamation-*
          echo "::endgroup::"

          echo "::group::prepare the test script"
          make test PLATFORM=$PLATFORM ARCH=$ARCH || echo "It should fail. Running remaining commands in the emulator"
          cat > commands.sh << EOF
            mv -f /data/local/tmp/sqlite3 /system/xbin
            cd /data/local/tmp
            $(make test PLATFORM=$PLATFORM ARCH=$ARCH -n)
          EOF
          echo "::endgroup::"

      - name: android test sqlite-agent
        if: matrix.name == 'android' && matrix.arch != 'arm64-v8a' && matrix.arch != 'armeabi-v7a'
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 26
          arch: ${{ matrix.arch }}
          script: |
            adb root
            adb remount
            adb push ${{ github.workspace }}/. /data/local/tmp/
            adb shell "sh /data/local/tmp/commands.sh"

      - name: test sqlite-agent
        if: contains(matrix.name, 'linux') || matrix.name == 'windows' || ( matrix.name == 'macos' && matrix.arch != 'x86_64' )
        run: ${{ matrix.name == 'linux-musl' && matrix.arch == 'arm64' && 'docker exec alpine' || '' }} make test ${{ matrix.make && matrix.make || ''}}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-${{ matrix.name }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: dist/agent.*
          if-no-files-found: error

  release:
    runs-on: ubuntu-22.04
    name: release
    needs: build
    if: github.ref == 'refs/heads/main'

    # contents: write to push the Package.swift checksum commit;
    # id-token: write for npm publish --provenance.
    permissions:
      contents: write
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts

      - name: zip artifacts
        run: |
          VERSION=$(make version)
          for folder in "artifacts"/*; do
            if [ -d "$folder" ]; then
              name=$(basename "$folder")
              if [[ "$name" != "agent-apple-xcframework" && "$name" != "agent-android-aar" ]]; then
                tar -czf "${name}-${VERSION}.tar.gz" -C "$folder" .
              fi
              if [[ "$name" == "agent-apple-xcframework" ]]; then
                # Use the ditto-created zip that preserves macOS symlinks and extract for other steps
                cp "$folder/agent.xcframework.zip" "${name}-${VERSION}.zip"
                unzip -q "$folder/agent.xcframework.zip" -d "$folder/"
              elif [[ "$name" != "agent-android-aar" ]]; then
                (cd "$folder" && zip -rq "../../${name}-${VERSION}.zip" .)
              else
                cp "$folder"/*.aar "${name}-${VERSION}.aar"
              fi
            fi
          done

      - name: release tag version from sqlite-agent.h
        id: tag
        run: |
          VERSION=$(make version)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # gh reads the token from GH_TOKEN in the job env, so it never
            # appears on a command line other processes can read.
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.name' 2>/dev/null || echo "")

            if [[ "$VERSION" != "$LATEST" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "version=$VERSION" >> $GITHUB_OUTPUT
            else
              echo "::warning file=src/sqlite-agent.h::To release a new version, please update the SQLITE_AGENT_VERSION in src/sqlite-agent.h to be different than the latest $LATEST"
            fi
            exit 0
          fi
          echo "❌ SQLITE_AGENT_VERSION not found in sqlite-agent.h"
          exit 1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.tag.outputs.version != ''
        with:
          distribution: 'temurin'
          java-version: '17'

      # The signing key and Sonatype credentials arrive as ORG_GRADLE_PROJECT_*
      # env vars, which Gradle exposes as the same project properties that
      # build.gradle reads. Passing them as -P put them in the process's argv,
      # where any other process on the runner could read them.
      - name: release android aar to maven central
        if: steps.tag.outputs.version != ''
        env:
          ORG_GRADLE_PROJECT_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: cd packages/android && ./gradlew publishAggregationToCentralPortal -PVERSION="${{ steps.tag.outputs.version }}" -PAAR_PATH="../../artifacts/agent-android-aar/agent.aar"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.tag.outputs.version != ''
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: build and publish npm packages
        if: steps.tag.outputs.version != ''
        run: |
          cd packages/node

          # Update version in package.json
          echo "Updating versions to ${{ steps.tag.outputs.version }}..."

          # Update package.json
          jq --arg version "${{ steps.tag.outputs.version }}" \
            '.version = $version | .optionalDependencies = (.optionalDependencies | with_entries(.value = $version))' \
            package.json > package.tmp.json && mv package.tmp.json package.json

          echo "✓ Updated package.json to version ${{ steps.tag.outputs.version }}"

          # Generate platform packages
          echo "Generating platform packages..."
          node generate-platform-packages.js "${{ steps.tag.outputs.version }}" "../../artifacts" "./platform-packages"
          echo "✓ Generated platform packages"
          ls -la platform-packages/

          # Build main package.
          # `npm install` rather than `npm ci`: the optionalDependencies are
          # this project's own platform packages at the version being released,
          # which by definition are not on the registry yet and so cannot be in
          # the lock file. With package-lock.json committed, npm install still
          # installs the locked toolchain versions — that is what pins the
          # build — and only the optional platform packages are left to fail,
          # which is expected here.
          echo "Building main package..."
          npm install
          npm run build
          npm test
          echo "✓ Main package built and tested"

          # Publish platform packages
          echo "Publishing platform packages to npm..."
          cd platform-packages
          for platform_dir in */; do
            platform_name=$(basename "$platform_dir")
            echo "  Publishing @sqliteai/sqlite-agent-${platform_name}..."
            cd "$platform_dir"
            npm publish --provenance --access public
            cd ..
            echo "  ✓ Published @sqliteai/sqlite-agent-${platform_name}"
          done
          cd ..

          # Publish main package
          echo "Publishing main package to npm..."
          npm publish --provenance --access public
          echo "✓ Published @sqliteai/sqlite-agent@${{ steps.tag.outputs.version }}"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Successfully published packages to npm"
          echo "   Main: @sqliteai/sqlite-agent@${{ steps.tag.outputs.version }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: update Package.swift checksum and version
        if: steps.tag.outputs.version != ''
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          ZIP="agent-apple-xcframework-${VERSION}.zip"
          if [ -f "$ZIP" ]; then
            CHECKSUM=$(swift package compute-checksum "$ZIP")
            URL="https://github.com/sqliteai/sqlite-agent/releases/download/${VERSION}/${ZIP}"
            sed -i "s|url: \".*apple-xcframework.*\"|url: \"${URL}\"|" Package.swift
            sed -i "s|checksum: \".*\"|checksum: \"${CHECKSUM}\"|" Package.swift
            git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git config --global user.name "$GITHUB_ACTOR"
            git add Package.swift
            git commit -m "Update Package.swift checksum for ${VERSION} [auto-update]" || true
            git push origin main || true
          fi

      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: steps.tag.outputs.version != ''
        with:
          token: ${{ secrets.RELEASE_PAT }}
          body: |

            ## Packages

            [**Flutter/Dart**](https://pub.dev/packages/sqlite_agent): `flutter pub add sqlite_agent:${{ steps.tag.outputs.version }}` or `dart pub add sqlite_agent:${{ steps.tag.outputs.version }}`
            [**Node**](https://www.npmjs.com/package/@sqliteai/sqlite-agent): `npm install @sqliteai/sqlite-agent`
            [**Android**](https://central.sonatype.com/artifact/ai.sqlite/agent): `ai.sqlite:agent:${{ steps.tag.outputs.version }}`
            [**Swift**](https://github.com/sqliteai/sqlite-agent#swift-package): [Installation Guide](https://github.com/sqliteai/sqlite-agent#swift-package)

            ## Installation

            **macOS:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.version }}/agent-macos-${{ steps.tag.outputs.version }}.tar.gz
            tar -xzf agent-macos-${{ steps.tag.outputs.version }}.tar.gz
            sqlite3 :memory: ".load ./agent.dylib" "SELECT agent_version();"
            ```

            **Linux:**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.version }}/agent-linux-x86_64-${{ steps.tag.outputs.version }}.tar.gz
            tar -xzf agent-linux-x86_64-${{ steps.tag.outputs.version }}.tar.gz
            sqlite3 :memory: ".load ./agent.so" "SELECT agent_version();"
            ```

            **Windows:**
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.version }}/agent-windows-x86_64-${{ steps.tag.outputs.version }}.zip" -OutFile "agent.zip"
            Expand-Archive -Path "agent.zip" -DestinationPath "."
            sqlite3 :memory: ".load ./agent.dll" "SELECT agent_version();"
            ```

            ---

          generate_release_notes: true
          tag_name: ${{ steps.tag.outputs.version }}
          files: agent-*-${{ steps.tag.outputs.version }}.*
          make_latest: true
